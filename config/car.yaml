# Car (Raspberry Pi) settings, layered on top of config/default.yaml.
# List only what differs from default.yaml; everything else, including tuned
# thresholds, comes from there.
#
# Use with:  --config config/car.yaml

camera:
  rotate: 180   # the camera is mounted upside down
  # flip_horizontal stays true from default.yaml (camera faces the driver). If a thumb
  # pointing to your right is detected as thumb_left, add  flip_horizontal: false  here.

actions:
  backend: bt_hid   # send gestures to the Bluetooth remote service (python -m gesturectl.hid)
