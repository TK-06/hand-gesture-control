# Hand-gesture media controller configuration.
# Distances marked "hand scales" are multiples of the wrist -> middle-knuckle length,
# so they work at any distance from the camera. Times are in seconds.

camera:
  source: auto            # auto = Pi ribbon camera if one is found, else OpenCV | opencv | picamera2
  index: 0                # which camera; try 1, 2... if the wrong one opens
  backend: auto           # auto | dshow | msmf | v4l2 | any  (auto = DirectShow on Windows)
  width: 320              # processing size; frames are resized to this
  height: 240
  fps: 30
  flip_horizontal: true   # mirror so the picture matches your point of view
  rotate: 0               # 0 | 90 | 180 | 270 clockwise, after the flip (for car mounting)

tracker:
  model: models/hand_landmarker.task
  num_hands: 1            # 2 hands roughly halves FPS on a Pi 4
  min_detection: 0.6
  min_presence: 0.6
  min_tracking: 0.5

geometry:
  extended_straightness: 0.80   # finger straight enough to count as extended
  extended_alignment: 0.50      # ...and pointing away from the palm
  curled_straightness: 0.55     # finger bent enough to count as curled
  curled_alignment: 0.0         # ...or pointing back toward the wrist
  thumb_open_distance: 0.45     # thumb tip to index knuckle (hand scales) for "five fingers"

gating:
  active_zone: [0.0, 0.0, 1.0, 1.0]  # x0, y0, x1, y1 (0..1); palm centre must be inside
  min_hand_scale: 0.08    # ignore hands smaller than this fraction of frame height
  min_score: 0.5
  pose_switch_s: 0.1      # a new pose must persist this long
  dropout_grace_s: 0.2    # tolerated tracking gaps
  cooldown_s: 1.0         # after any gesture (continuous circling excepted)

gestures:
  circle:                 # index finger only, draw circles
    min_step: 0.12        # hand scales; fingertip moves smaller than this are ignored
    max_turn_deg: 135.0
    first_step_deg: 270.0 # first volume step after 3/4 of a circle...
    step_deg: 180.0       # ...then one more step every half circle
    reverse_reset_deg: 90.0
    min_diameter: 0.35    # hand scales
    idle_reset_s: 1.0
    first_step_max_s: 3.0
  static:                 # poses held still: five fingers, thumb, "phone" hand
    hold_s: 0.6           # hold the pose this long to fire (once per hold)
    max_drift: 0.3        # hand scales; moving more than this restarts the hold
    release_s: 0.3        # show something else this long before the same pose can fire again
    thumb_tolerance_deg: 35.0   # how far off up/right/left/down the thumb may point
    phone_tolerance_deg: 30.0   # how far off vertical/horizontal the phone hand may be
    repeat_s: 2.0               # keep holding next/previous: skip again every 2 s (0 = off)
    repeat_gestures: [thumb_right, thumb_left]
  grab:                   # fist <-> five fingers (older gesture, off in the mapping)
    arm_hold_s: 0.4       # hold the start pose still this long
    arm_max_drift: 0.3    # hand scales
    transition_max_s: 0.8
    transition_max_move: 0.5  # hand scales; the hand must change pose in place
    target_hold_s: 0.2
  swipe:                  # two fingers, swipe (older gesture, off in the mapping)
    arm_hold_s: 0.3
    arm_max_drift: 0.25
    start_distance: 0.25
    min_distance: 1.0     # hand scales
    max_duration_s: 0.8
    axis_ratio: 2.0

overlay:
  scale: 2.0              # debug window upscale

actions:
  backend: print          # print = just log actions (laptop) | bt_hid = send to the Bluetooth remote (Pi)

hid:                      # the Bluetooth LE remote service: python -m gesturectl.hid
  name: Gesture Remote    # shown in the iPhone's Bluetooth list
  adapter: hci0
  profile: media          # media | media+keyboard (fallback if iOS ignores a media-only remote)
  host: 127.0.0.1         # where the service listens for actions (local only)
  port: 47231
  pairing_window_s: 120.0 # how long `pair` accepts a new phone
  key_press_s: 0.15       # key down -> key up; iOS ignored volume keys at 0.03 (tested, iPhone 15 / iOS 26.6.1)

# gesture -> action. This list replaces the built-in mapping: a gesture left out
# (or mapped to null) is disabled.
# Actions: volume_up volume_down play pause play_pause next previous answer_call end_call
mapping:
  circle_cw: volume_up          # index finger only, circle clockwise
  circle_ccw: volume_down       # ... counter-clockwise
  open_palm: pause              # five fingers up, held still
  thumb_up: play                # thumbs up, held still
  thumb_right: next             # thumb pointing to your right
  thumb_left: previous          # thumb pointing to your left
  thumb_down: null              # available, not used
  phone_vertical: answer_call   # thumb + pinky out, held upright like a phone
  phone_horizontal: end_call    # same hand shape, held sideways
  # Older motion gestures, switched off (unreliable at the Pi's ~9 fps).
  fist_to_open: null
  open_to_fist: null
  swipe_up: null
  swipe_down: null
  swipe_left: null
  swipe_right: null
