[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gesturectl"
version = "0.1.0"
description = "Hand-gesture media controller: camera -> hand landmarks -> gestures -> media actions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taj Kongsaeree" }]
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (Pi + laptop tested set).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
